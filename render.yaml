# Render Blueprint — deploys the Promptineering backend as a free web service.
# In the Render dashboard: New → Blueprint → connect this repo. Render reads
# this file, provisions the service, and prompts for the secret env vars
# marked `sync: false` (your Gemini key and the frontend origin).
#
# The frontend deploys separately to Vercel (see DEPLOYMENT.md). If you'd
# rather host everything on Render, uncomment the static-site block below.
services:
  - type: web
    name: promptineer-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard — never committed
      - key: PROMPTINEERING_SECRET
        generateValue: true  # Render generates a strong JWT signing secret
      - key: PROMPTINEERING_CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app (custom domain)
      - key: PROMPTINEERING_UPLOAD_DIR
        value: /tmp/uploads  # writable on the ephemeral free-tier filesystem

